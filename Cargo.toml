[package]
name = "shorturl"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["fullstack"] }
url = "2"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
axum = { version = "0.8", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "dep:axum", "dep:sqlx", "dep:tokio"]
